version: '3.8'

services:
  postgres:
    image: postgres:13-alpine
    container_name: store-postgres
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - store-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store_user -d store"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: store-redis
    ports:
      - "6379:6379"
    networks:
      - store-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  store-api:
    build: .
    container_name: store-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/store
      DB_USERNAME: store_user
      DB_PASSWORD: ${DB_PASSWORD:-your_secure_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8082
      SERVER_SERVLET_CONTEXT_PATH: /api
      DDL_AUTO: update
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-WARN}
      LOGGING_LEVEL_QUANTRAN_API: ${LOGGING_LEVEL_QUANTRAN_API:-INFO}
      APP_RATE_LIMIT_MAX_REQUESTS_PER_MINUTE: ${APP_RATE_LIMIT_MAX_REQUESTS_PER_MINUTE:-100}
      APP_RATE_LIMIT_ENABLED: ${APP_RATE_LIMIT_ENABLED:-true}
    ports:
      - "8082:8082"
    volumes:
      - store_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - store-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: store-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - store-api
    networks:
      - store-network
    restart: unless-stopped
    profiles:
      - nginx

volumes:
  postgres_data:
    driver: local
  store_logs:
    driver: local

networks:
  store-network:
    driver: bridge
